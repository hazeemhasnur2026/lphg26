[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

# Kedua proses menulis lognya ke keluaran container, bukan ke berkas di dalam
# container. Log yang hanya ada di dalam container akan hilang bersama
# container itu, dan tidak terbaca `docker logs`.

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
