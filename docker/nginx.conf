server {
    listen 80;
    server_name _;

    root /app/backend/public;
    index index.php;

    client_max_body_size 12M;

    # Header keamanan juga dipasang aplikasi lewat middleware. Yang di sini
    # menjaga berkas statis, yang tidak pernah melewati PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gambar dan aset hasil build tidak pernah berubah tanpa berganti nama,
    # jadi aman disimpan lama di peramban.
    #
    # Yang menutup blok ini harus @laravel, bukan =404. Sebagian aset justru
    # dilayani aplikasi, bukan berkas di disk: Livewire menyajikan
    # /livewire/livewire.min.js lewat rute. Dengan =404, nginx menolaknya
    # sebelum PHP sempat menjawab, Livewire tidak pernah hidup di peramban,
    # dan formulir panel admin berubah menjadi kiriman GET biasa yang hanya
    # memuat ulang halaman. Tidak ada galat di log aplikasi, karena
    # permintaannya memang tidak pernah sampai ke sana.
    location ~* \.(webp|jpg|jpeg|png|gif|svg|woff2?|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @laravel;
    }

    # Cache panjang di atas tidak ikut ke sini, jadi jawaban dari aplikasi
    # memakai header cache-nya sendiri.
    location @laravel {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Berkas tersembunyi tidak pernah dilayani, termasuk .env bila suatu saat
    # tidak sengaja tersalin ke public/.
    location ~ /\. {
        deny all;
    }
}
