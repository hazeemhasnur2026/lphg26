server {
    listen 80;
    server_name _;

    root /app/backend/public;
    index index.php;

    client_max_body_size 12M;

    # Header keamanan juga dipasang aplikasi lewat middleware. Yang di sini
    # menjaga berkas statis, yang tidak pernah melewati PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gambar dan aset hasil build tidak pernah berubah tanpa berganti nama,
    # jadi aman disimpan lama di peramban.
    #
    # Yang menutup blok ini harus @laravel, bukan =404. Sebagian aset justru
    # dilayani aplikasi, bukan berkas di disk: Livewire menyajikan
    # /livewire/livewire.min.js lewat rute. Dengan =404, nginx menolaknya
    # sebelum PHP sempat menjawab, Livewire tidak pernah hidup di peramban,
    # dan formulir panel admin berubah menjadi kiriman GET biasa yang hanya
    # memuat ulang halaman. Tidak ada galat di log aplikasi, karena
    # permintaannya memang tidak pernah sampai ke sana.
    location ~* \.(webp|jpg|jpeg|png|gif|svg|woff2?|css|js)$ {
        expires 1y;
        access_log off;

        # Header keamanan diulang di sini, dan pengulangan itu wajib.
        #
        # add_header tidak diwariskan ke blok yang punya add_header sendiri:
        # begitu blok ini menambahkan Cache-Control, ketiga header di level
        # server berhenti terkirim untuk setiap berkas statis. Yang paling
        # merugikan hilangnya adalah nosniff, justru pada berkas unggahan —
        # tanpa itu peramban boleh menebak sendiri tipe berkas yang diunggah
        # orang, dan tebakan yang salah menjalankan isinya.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable" always;

        try_files $uri @laravel;
    }

    # Tidak ada yang boleh dieksekusi dari direktori yang isinya diunggah orang
    # atau disalin dari luar repositori. Ditulis sebelum blok PHP di bawah
    # karena nginx memakai lokasi regex pertama yang cocok.
    location ~ ^/(content-images|content-images-opt|assets)/.*\.(php|phtml|phar|phps)$ {
        deny all;
    }

    # Cache panjang di atas tidak ikut ke sini, jadi jawaban dari aplikasi
    # memakai header cache-nya sendiri.
    location @laravel {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # Persis satu berkas, bukan pola.
    #
    # `location ~ \.php$` cocok dengan berkas .php mana pun di bawah document
    # root — dan document root memuat symlink ke folder unggahan. Diuji pada
    # 29 September 2026: sebuah berkas .php yang ditaruh di content-images/
    # benar-benar dieksekusi php-fpm.
    #
    # Satu-satunya .php yang sah di sini adalah index.php milik Laravel, dan
    # seluruh permintaan lain sampai kepadanya lewat try_files, bukan lewat
    # namanya sendiri.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # Berkas tersembunyi tidak pernah dilayani, termasuk .env bila suatu saat
    # tidak sengaja tersalin ke public/.
    location ~ /\. {
        deny all;
    }
}
